<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRISM — oficina de transformação</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121522;color:#eff2ff;font:15px system-ui}canvas{width:100vw;height:100vh;display:block;touch-action:none}header{position:absolute;top:28px;left:34px;pointer-events:none}small{color:#7ce6ff;letter-spacing:3px;font-size:11px}h1{font-size:32px;margin:8px 0}p{color:#acb4ce;margin:4px 0}footer{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);padding:16px;background:#101422e8;border:1px solid #444963;border-radius:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:95vw;width:max-content}select{background:#24293e;color:#fff;border:1px solid #555775;border-radius:8px;padding:10px}button{border:1px solid #555775;border-radius:8px;background:#24293e;color:#f7f8ff;font:600 14px system-ui;padding:12px 19px;cursor:pointer}button:hover{background:#3c355c}button:disabled{opacity:.45;cursor:wait}button[data-active=true]{background:#49307d;border-color:#aa8aeb}#status{position:absolute;right:28px;top:30px;color:#bed0e1;font-size:13px}#hint{position:absolute;left:34px;bottom:180px;font-size:12px;color:#939eb9}
</style></head><body><canvas id="view"></canvas><header><small>OFICINA DE ARMAS · PRISM</small><h1 id="mode">Assault rifle</h1><p>Três formas. Uma estrutura que se transforma.</p><p id="shot-description" style="font-size:13px;margin-top:10px"></p></header><div id="status">Carregando modelo…</div><div id="hint">Arraste para girar · roda do mouse para aproximar</div><footer><button data-mode="0">01 · Assault</button><button data-mode="1">02 · Sniper</button><button data-mode="2">03 · Lança-granadas</button><button id="fire">Disparar</button><button id="reload">Recarregar</button><button id="impact">Ver impacto</button><select id="speed" aria-label="Velocidade da animação"><option value="1">Velocidade normal</option><option value="0.25">Câmera lenta · ¼×</option><option value="0.1">Inspeção · 1/10×</option></select><button id="pause" disabled>Pausar</button><input id="scrub" type="range" min="0" max="100" value="0" aria-label="Posição da animação" disabled><div style="flex-basis:100%;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap"><label for="transform-sound">Som da transformação</label><select id="transform-sound"><option value="alien-pulse">Alien · pulsos</option><option value="alien-organic">Alien · orgânico</option><option value="alien-crystal">Alien · cristal</option><option value="alien-portal">Alien · portal</option><option value="tech-servo">Mecânico · anterior</option></select><button id="listen-transform">Ouvir som</button><button id="stop-sound">Parar som</button></div><label style="display:flex;align-items:center;gap:6px;font-size:12px">Som <input id="volume" aria-label="Volume do som" type="range" min="0" max="100" value="45" style="width:80px"></label></footer><script type="module" src="/src/tools/WeaponLab.ts"></script></body></html>
